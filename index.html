<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belghamdi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Belghamdi Split – متابع التمارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1a2b; --bg2:#0b1422; --card:#162540; --card2:#1d2f4f; --line:#2a3e63;
  --chalk:#f3efe6; --mut:#93a3bf; --mut2:#667a9c;
  --yel:#ffc531; --yel-ink:#2a1d00;
  --red:#e5384b; --blue:#4f9bff; --grn:#2fbf71; --white:#ffffff;
  --ff:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
  --fn:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--ff);font-size:15px;line-height:1.6;
  background-image:radial-gradient(900px 500px at 100% -10%,rgba(79,155,255,.14),transparent 60%),radial-gradient(700px 420px at -10% 0%,rgba(229,56,75,.10),transparent 60%);
  background-attachment:fixed;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
a{color:var(--yel)}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:8px}
.num{font-family:var(--fn);font-weight:800;letter-spacing:.3px;direction:ltr;display:inline-block;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main{padding-bottom:calc(var(--nav) + 120px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}

/* ---------- top ---------- */
.top{padding:calc(22px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:23px;font-weight:700;line-height:1.2}
.top p{margin:2px 0 0;color:var(--mut);font-size:13px}
.brand{white-space:nowrap;font-family:var(--fn);font-weight:900;font-size:15px;color:var(--yel);letter-spacing:.5px;direction:ltr}

/* ---------- section ---------- */
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font-size:18px;font-weight:600}
.sec small{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--mut)}

/* ---------- hero (next session) ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--card2),var(--card));isolation:isolate}
.hero .plate{position:absolute;inset-inline-end:-46px;top:-46px;width:210px;height:210px;border-radius:50%;z-index:-1;opacity:.95;
  background:radial-gradient(circle at 50% 50%,var(--bg) 0 15%,transparent 15.5%),repeating-radial-gradient(circle at 50% 50%,transparent 0 22px,rgba(0,0,0,.14) 22px 24px),var(--pc,var(--red))}
.hero .plate::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
.hero.pos{--pc:var(--blue)}
.hero h3{margin:0;font-family:var(--fn);font-size:46px;line-height:1;font-weight:900;direction:ltr;text-align:right}
.hero .ar{font-size:15px;color:var(--chalk);opacity:.85;margin-top:6px}
.hero .meta{display:flex;gap:18px;margin:16px 0 18px;color:var(--mut);font-size:13px}
.hero .meta b{color:var(--chalk);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 20px;font-weight:600;min-height:48px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--yel);color:var(--yel-ink);box-shadow:0 8px 24px -8px rgba(255,197,49,.55)}
.btn.sec2{background:var(--card2);border:1px solid var(--line)}
.btn.ghost{border:1px solid var(--line);color:var(--mut)}
.btn.dng{background:rgba(229,56,75,.14);color:#ff8795;border:1px solid rgba(229,56,75,.4)}
.btn.block{width:100%}
.btn svg{font-size:18px}
.resume{margin-top:12px;display:flex;align-items:center;gap:12px;background:rgba(255,197,49,.1);border:1px solid rgba(255,197,49,.45);border-radius:16px;padding:12px 14px}
.resume b{display:block}.resume span{font-size:12.5px;color:var(--mut)}
.resume .btn{margin-inline-start:auto;padding:10px 16px;min-height:42px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px 10px;text-align:center}
.stat .v{font-family:var(--fn);font-weight:800;font-size:32px;line-height:1.05;direction:ltr}
.stat .v small{font-size:14px;color:var(--mut);font-weight:600;margin-inline-start:2px}
.stat .l{font-size:12px;color:var(--mut)}

/* ---------- 12 weeks ---------- */
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.wk{aspect-ratio:1/1.5;border-radius:8px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:4px 0;gap:2px;position:relative}
.wk i{display:block;width:60%;height:5px;border-radius:3px;background:var(--line)}
.wk i.f{background:var(--grn)}
.wk.cur{border-color:var(--yel);box-shadow:0 0 0 1px var(--yel) inset}
.wk em{font-style:normal;position:absolute;top:3px;font-family:var(--fn);font-size:12px;color:var(--mut2);font-weight:700}
.wk.cur em{color:var(--yel)}
.bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar>div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--yel),var(--grn));transition:width .5s}

/* ---------- day cards ---------- */
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day{position:relative;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;overflow:hidden;min-height:112px;display:flex;flex-direction:column;gap:2px}
.day::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--pc)}
.day.ant{--pc:var(--red)}.day.pos{--pc:var(--blue)}
.day b{font-family:var(--fn);font-size:26px;font-weight:900;line-height:1.1;direction:ltr;text-align:right}
.day .ar{font-size:13px;color:var(--mut)}
.day .ft{margin-top:auto;font-size:12px;color:var(--mut2);display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.day .go{color:var(--yel);font-weight:600;font-size:13px}
.day.next{border-color:var(--yel)}

/* ---------- list rows ---------- */
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.row .pill{width:10px;height:36px;border-radius:5px;background:var(--pc)}
.row.ant{--pc:var(--red)}.row.pos{--pc:var(--blue)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;direction:ltr;text-align:right}
.row .t span{font-size:12.5px;color:var(--mut)}
.row .x{color:var(--mut)}
.hist-d{margin:-4px 0 10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px}
.hist-d div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.hist-d div:last-child{border:0}
.hist-d .ltr{color:var(--mut)}

/* ---------- program view ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pl{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;white-space:nowrap}
.pl.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk)}
.pl.dot::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-inline-end:8px}
.pl.ant{--pc:var(--red)}.pl.pos{--pc:var(--blue)}
.pex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.pex .h{display:flex;align-items:center;gap:12px}
.pex .h b{flex:1;font-weight:600;font-size:16px;direction:ltr;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--mut)}
.tag b{color:var(--chalk);font-family:var(--fn);font-size:15px;font-weight:800;direction:ltr;display:inline-block}
.note{margin-top:10px;background:rgba(255,197,49,.08);border-inline-start:3px solid var(--yel);border-radius:6px 12px 12px 6px;padding:8px 12px;font-size:13.5px;color:#f2e4bd}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.alts>span{font-size:12.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;direction:ltr}
.chip.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk);font-weight:600}
.chip .pbtn{width:26px;height:26px;font-size:12px}
.vbtn,.pbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--red);color:#fff;flex:none;transition:transform .12s}
.vbtn{width:44px;height:44px;font-size:17px}
.pbtn{width:28px;height:28px;font-size:13px}
.vbtn:active,.pbtn:active{transform:scale(.9)}
.vbtn.none,.pbtn.none{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.vbtn svg,.pbtn svg{fill:currentColor;stroke:none}
.vbtn.none svg,.pbtn.none svg{fill:none;stroke:currentColor;stroke-width:2}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.acc>summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
.acc[open]>summary::after{transform:rotate(-135deg)}
.acc .in{padding:0 16px 14px;color:#d7deea;font-size:14px}
.acc .in p{margin:0 0 10px}
.prep{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.prep b{flex:1;font-weight:500;direction:ltr;text-align:right}
.prep span{font-size:12.5px;color:var(--mut);direction:ltr}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ---------- progress ---------- */
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px 8px}
.chartbox svg{width:100%;height:auto;display:block;font-family:var(--fn)}
select.sel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;direction:ltr;margin-bottom:10px;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:26px 16px;border:1px dashed var(--line);border-radius:18px}
.pr{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.pr b{flex:1;font-weight:500;direction:ltr;text-align:right}
.pr .num{font-size:24px;color:var(--yel)}
.pr small{color:var(--mut)}

/* ---------- settings ---------- */
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.fld:last-child{border:0}
.fld label{flex:1}.fld label small{display:block;color:var(--mut);font-size:12.5px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-family:var(--fn);font-weight:800;font-size:17px;color:var(--mut);direction:ltr}
.seg button.on{background:var(--chalk);color:var(--bg)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.sw.on{background:var(--grn);border-color:var(--grn)}
.sw.on::after{background:#fff;transform:translateX(-20px)}
.txt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:170px;font-size:16px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- nav ---------- */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:40;background:rgba(11,20,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut2);font-size:11.5px;font-weight:500;position:relative}
.nav button svg{font-size:23px}
.nav button.on{color:var(--yel)}
.nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--yel)}

/* ---------- rest timer ---------- */
.rest{position:fixed;z-index:70;inset-inline:12px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;background:var(--chalk);color:var(--bg);border-radius:20px;padding:10px 12px 12px;box-shadow:0 18px 40px -10px rgba(0,0,0,.6);display:none;transform:translateY(20px);opacity:0;transition:.25s}
.rest.on{display:block;transform:none;opacity:1}
body.insess .rest{bottom:calc(14px + env(safe-area-inset-bottom))}
.rest .r1{display:flex;align-items:center;gap:10px}
.rest .tm{font-family:var(--fn);font-weight:900;font-size:40px;line-height:1;direction:ltr;min-width:96px;text-align:center}
.rest .lb{min-width:0;font-size:12px;font-weight:600;flex:1;line-height:1.3}
.rest .lb small{display:block;font-weight:400;opacity:.7}
.rest button{background:rgba(15,26,43,.1);border-radius:12px;min-width:44px;height:44px;font-family:var(--fn);font-weight:800;font-size:17px;padding:0 10px;direction:ltr}
.rest button.skip{background:var(--bg);color:var(--chalk);font-family:var(--ff);font-size:14px;padding:0 16px}
.rest .rb{height:5px;background:rgba(15,26,43,.15);border-radius:4px;margin-top:9px;overflow:hidden}
.rest .rb i{display:block;height:100%;background:var(--red);border-radius:4px;width:100%}
.rest.done{background:var(--grn);color:#04210f}
.rest.done .rb i{background:#04210f}

/* ---------- session overlay ---------- */
#session{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain;
  background-image:radial-gradient(900px 500px at 100% -10%,rgba(79,155,255,.12),transparent 60%),radial-gradient(700px 420px at -10% 0%,rgba(229,56,75,.09),transparent 60%)}
#session.on{display:block}
.shead{position:sticky;top:0;z-index:5;background:rgba(15,26,43,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.shead .r{display:flex;align-items:center;gap:12px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.shead .tt{flex:1;min-width:0}
.shead .tt b{display:block;font-family:var(--fn);font-size:26px;line-height:1;font-weight:900;direction:ltr;text-align:right}
.shead .tt span{font-size:12.5px;color:var(--mut)}
.clock{font-family:var(--fn);font-weight:800;font-size:26px;direction:ltr;color:var(--yel)}
.shead .bar{margin-top:10px}
.shead .bar>div{background:var(--yel)}
.vthumb{position:relative;display:block;margin:12px auto;width:min(100%,250px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#0b1422;border:1px solid var(--line)}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb .vplay{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.vthumb .vplay svg{fill:currentColor;stroke:none}
.warnbox{margin-top:12px;background:rgba(229,56,75,.12);border:1px solid rgba(229,56,75,.5);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#ffb3bc}
.shead .pg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.sbody{padding:16px 0 220px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;margin-bottom:14px;position:relative;overflow:hidden}
.ex.ant{--pc:var(--red)}.ex.pos{--pc:var(--blue)}
.ex::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--pc)}
.ex.fin{border-color:rgba(47,191,113,.6)}
.ex.skipped{opacity:.5}
.ex .h{display:flex;align-items:flex-start;gap:12px}
.ex .idx{font-family:var(--fn);font-weight:900;font-size:30px;line-height:1;color:var(--pc);min-width:26px;text-align:center;padding-top:3px}
.ex .nm{flex:1;min-width:0}
.ex .nm b{display:block;font-size:18px;font-weight:600;line-height:1.3;direction:ltr;text-align:right}
.ex .nm span{font-size:12.5px;color:var(--mut)}
.hint{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}
.hint .last{background:var(--bg2);border-radius:10px;padding:5px 10px;border:1px solid var(--line)}
.hint .last .ltr{color:var(--chalk)}
.hint .sug{background:rgba(255,197,49,.12);border:1px solid rgba(255,197,49,.5);color:var(--yel);border-radius:10px;padding:5px 10px;font-weight:500}
.sets{margin-top:12px}
.sh,.set{display:grid;grid-template-columns:28px 1fr 1fr 54px;gap:8px;align-items:center}
.sh{font-size:11.5px;color:var(--mut2);padding:0 0 4px;text-align:center}
.set{padding:5px 0}
.set .sn{font-family:var(--fn);font-weight:800;font-size:20px;color:var(--mut);text-align:center}
.f{direction:ltr;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;height:50px;overflow:hidden;transition:border-color .15s,background .15s}
.f:focus-within{border-color:var(--yel)}
.f input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;text-align:center;font-family:var(--fn);font-weight:800;font-size:25px;direction:ltr;padding:0}
.f input::placeholder{color:#4a5f84;opacity:1}
.f .st{width:28px;height:100%;color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.f .st:active{background:var(--card2)}
.set.done .f{background:rgba(47,191,113,.12);border-color:rgba(47,191,113,.55)}
.set.pr .f{border-color:var(--yel);background:rgba(255,197,49,.12)}
.set.shake .f{border-color:var(--red);animation:sh .35s}
@keyframes sh{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
/* the plate button */
.chk{width:50px;height:50px;border-radius:50%;position:relative;background:
  radial-gradient(circle,var(--bg) 0 17%,transparent 18%),
  repeating-radial-gradient(circle,transparent 0 6px,rgba(255,255,255,.06) 6px 7px),var(--card2);
  border:2px solid var(--line);transition:background-color .2s,border-color .2s,transform .35s;flex:none}
.chk:active{transform:scale(.92)}
.set.done .chk{background:
  radial-gradient(circle,var(--bg) 0 17%,transparent 18%),
  repeating-radial-gradient(circle,transparent 0 6px,rgba(0,0,0,.14) 6px 7px),var(--grn);border-color:var(--grn);transform:rotate(180deg)}

.xbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.bm-stage{position:relative;direction:ltr;border-radius:28px;border:1px solid var(--line);overflow:hidden;height:clamp(460px,70vh,660px);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 55% at 50% 40%,#27426e 0%,#152641 58%,#0d1729 100%)}

.bm-rig{position:relative;flex:none;transform-style:preserve-3d;will-change:transform}
.bm-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bm-face.fr{transform:translateZ(1px)}

.bm-floor{position:absolute;left:50%;bottom:50px;width:190px;height:26px;margin-left:-95px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);pointer-events:none;transform-origin:center}
.bm-dim{position:absolute;inset:0;background:#0a1222;opacity:0;pointer-events:none}

.bm-hint{position:absolute;inset-inline:0;top:12px;text-align:center;font-size:12px;color:var(--mut);direction:rtl;pointer-events:none;transition:opacity .4s}

.bd{fill:none;stroke:rgba(10,20,40,.55);stroke-width:1.1;stroke-linecap:round}

.mm{fill:var(--c,#2c4573);stroke:#0b1527;stroke-width:1.15;stroke-linejoin:round;transition:fill .8s ease,stroke .3s}

/* ================= history queries ================= */
function lastPerf(name){
  for(let i=S.sessions.length-1;i>=0;i--){
    const ex=S.sessions[i].ex.find(e=>e.name===name&&e.sets.length);
    if(ex)return{sets:ex.sets,ts:S.sessions[i].start};
  }
  return null;
}
function bestE1(name){let b=0;S.sessions.forEach(s=>s.ex.forEach(e=>{if(e.name===name)e.sets.forEach(x=>{b=Math.max(b,e1rm(+x.w,+x.r))})}));return b}
function nextDayId(){
  const order=['AA','PA','AB','PB'];
  const l=S.sessions[S.sessions.length-1];
  if(!l)return'AA';
  return order[(order.indexOf(l.day)+1)%4];
}
function lastOfDay(id){for(let i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].day===id)return S.sessions[i];return null}
function progStart(){return S.start||(S.sessions[0]&&S.sessions[0].start)||null}

function ask(msg,o={}){return new Promise(res=>{
  const d=$('#dlg'),b=$('#dlgBox');
  b.innerHTML=`<h3 style="direction:rtl;text-align:right;font-size:16.5px;line-height:1.7;font-weight:500">${esc(msg)}</h3><div style="display:flex;gap:10px;margin-top:16px"><button class="btn ${o.danger?'dng':'pri'}" style="flex:1" data-r="1">${esc(o.ok||'تمام')}</button>${o.info?'':`<button class="btn ghost" style="flex:1" data-r="0">${esc(o.cancel||'إلغاء')}</button>`}</div>`;
  d.classList.add('on');
  d.onclick=e=>{const r=e.target.closest('[data-r]');if(r||e.target===d){d.classList.remove('on');d.onclick=null;res(!!r&&r.dataset.r==='1')}};
})}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
let ac;
function beep(n=3){
  if(!S.settings.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=i===n-1?1046:784;
      const t=ac.currentTime+i*.22;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)}
  }catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#e5384b','#4f9bff','#ffc531','#2fbf71','#f3efe6'];
  const P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*5|0]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.42;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/130);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<130)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ================= rest timer ================= */
let rest=null;
function startRest(sec,sub){
  rest={end:Date.now()+sec*1000,total:sec,done:false};
  $('#restSub').textContent=sub||'بين المجموعات';
  $('#rest').classList.add('on');$('#rest').classList.remove('done');tickRest();
}
function stopRest(){rest=null;$('#rest').classList.remove('on','done')}
function tickRest(){
  if(!rest)return;
  const left=(rest.end-Date.now())/1000;
  const r=$('#rest');
  if(left<=0){
    if(!rest.done){rest.done=true;r.classList.add('done');$('#restTm').textContent='يلا!';$('#restSub').textContent='الراحة خلصت';$('#restBar').style.width='0%';beep(3);buzz([200,100,200,100,300]);setTimeout(()=>{if(rest&&rest.done)stopRest()},6000)}
    return;
  }
  $('#restTm').textContent=mmss(left);
  $('#restBar').style.width=(left/rest.total*100)+'%';
}
$('#rest').addEventListener('click',e=>{
  const b=e.target.closest('[data-rest]');if(!b||!rest)return;
  const v=b.dataset.rest;
  if(v==='skip'){stopRest();return}
  if(rest.done){return}
  rest.end+=(+v)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);tickRest();
});

function weekStreak(){
  const ws=weekStart(Date.now()),wk=i=>{const d=new Date(ws);d.setDate(d.getDate()-7*i);return d.getTime()};

function progOf(a){let t=0,dn=0;a.ex.forEach(e=>{if(!e.skip)e.sets.forEach(s=>{t++;if(s.d)dn++})});return{total:t,done:dn}}
async function startSession(id){
  if(S.active&&S.active.day!==id){if(!await ask('عندك تمرين شغّال. تبدأ تمرين جديد وتلغي الشغّال؟',{ok:'ابدأ الجديد',cancel:'كمّل الشغّال',danger:true}))return openSession()}
  if(!S.active||S.active.day!==id){
    const d=dayById(id);
    S.active={id:uid(),day:id,start:Date.now(),warm:{},ex:d.exercises.map((e,i)=>({i,name:e.name,skip:false,sets:Array.from({length:e.sets},()=>({w:'',r:'',d:false}))}))};
    if(!S.start)S.start=Date.now();
    saveNow();
  }
  openSession();
}
async function lockScreen(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.active&&sess.classList.contains('on'))lockScreen()});

}
function sparkSvg(v){
  if(v.length<2)return'';
  const W=60,H=20,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*(W-6)+3).toFixed(1)},${(H-3-(y-mn)/r*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="آخر ${v.length} مرات"><polyline points="${pts}" fill="none" stroke="${v[v.length-1]>=v[0]?'var(--grn)':'var(--red)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function hintFor(name,e){
  const hist=[];
  S.sessions.forEach(s=>{const x=s.ex.find(z=>z.name===name&&z.sets.length);if(x)hist.push(x.sets)});
  if(!hist.length)return{sug:'',plateau:'',spark:''};
  const last=hist[hist.length-1];
  const rr=(String(e.reps).match(/\d+/g)||[]).map(Number),rmin=rr[0]||1,rmax=rr[rr.length-1]||rmin;
  const top=Math.max(...last.map(s=>+s.w));
  let msg;
  if(last.every(s=>+s.r>=rmax))msg=`زوّد لـ ${fmt(top+S.settings.step)} كجم وابدأ من ${rmin} عدّات`;
  else if(last.some(s=>+s.r<rmin))msg=`ثبّت ${fmt(top)} كجم وارفع كل المجموعات لـ ${rmin} عدّات على الأقل`;
  else msg=`نفس ${fmt(top)} كجم وحاول تزوّد عدّة في كل مجموعة`;
  const best=h=>Math.max(...h.map(s=>e1rm(+s.w,+s.r)));
  const bs=hist.map(best);
  let plateau='';
  if(hist.length>=4){const prev=Math.max(...bs.slice(0,-3));if(bs.slice(-3).every(b=>b<=prev*1.005))plateau=`<span class="sug warn">ثابت من 3 مرات. جرّب تركّز على العدّات أو بديل</span>`}
  return{sug:`<span class="sug">${msg}</span>`,plateau,spark:sparkSvg(bs.slice(-5))};
}

function toggleSet(i,k,row){
  const a=S.active,st=a.ex[i],s=st.sets[k];
  if(!s.d){
    const last=lastPerf(st.name),p=last&&(last.sets[k]||last.sets[last.sets.length-1]);
    const wi=$('[data-f=w]',row),ri=$('[data-f=r]',row);
    if(!(parseFloat(s.w)>=0))s.w='';if(!(parseInt(s.r)>0))s.r='';
    if(!s.w&&k>0&&st.sets[k-1].w)s.w=st.sets[k-1].w;
    if(!s.w&&p)s.w=fmt(p.w);
    if(!s.r&&p)s.r=String(p.r);
    if(!s.w||!s.r){const msg=!s.w?'اكتب الوزن الأول':'اكتب عدد العدّات';toast(msg);row.classList.add('shake');setTimeout(()=>row.classList.remove('shake'),400);const old=row.nextElementSibling;if(old&&old.classList.contains('rowerr'))old.remove();const er=document.createElement('div');er.className='rowerr';er.textContent=msg;row.after(er);setTimeout(()=>er.remove(),2400);(!s.w?wi:ri).focus({preventScroll:true});row.scrollIntoView({block:'center',behavior:'smooth'});return}
    wi.value=s.w;ri.value=s.r;
    s.d=true;

    const prev=bestE1(st.name),now=e1rm(+s.w,+s.r);
    s.pr=prev>0&&now>prev*1.0001&&!st.sets.some((o,j)=>j!==k&&o.pr&&e1rm(+o.w,+o.r)>=now);
    if(s.pr){toast('رقم قياسي جديد! 🏆');buzz([60,40,60])}else buzz(25);

    st.sets.forEach((o,j)=>{if(j>k&&!o.d&&!o.w){o.w=s.w;const inp=$(`.set[data-i="${i}"][data-s="${j}"] [data-f=w]`,sess);if(inp)inp.value=s.w}});

      const lastSet=k===st.sets.length-1;

async function finishSession(){
  const a=S.active,p=progOf(a);

  const end=Date.now(),ex=[];let vol=0;const prs=[];
  a.ex.forEach(e=>{
    if(e.skip)return;
    const sets=e.sets.filter(s=>s.d).map(s=>({w:+s.w,r:+s.r}));
    if(!sets.length)return;
    sets.forEach(s=>vol+=s.w*s.r);
    const prev=bestE1(e.name),best=Math.max(...sets.map(s=>e1rm(s.w,s.r)));
    const top=sets.reduce((m,s)=>e1rm(s.w,s.r)>e1rm(m.w,m.r)?s:m,sets[0]);
    if(prev>0&&best>prev*1.0001)prs.push({name:e.name,w:top.w,r:top.r,up:Math.round((best/prev-1)*1000)/10});
    ex.push({name:e.name,sets});
  });
  const rec={id:a.id,day:a.day,start:a.start,end,dur:end-a.start,vol:Math.round(vol),sets:p.done,warm:DATA.prep.filter((x,i)=>a.warm['p'+i]).length,ex};
  const prevS=lastOfDay(a.day);let cmp='';
  if(prevS&&prevS.vol>0){const df=Math.round((rec.vol/prevS.vol-1)*100);cmp=df===0?`نفس حجم آخر ${dayById(a.day).en}`:`حجم أ${df>0?'على':'قل'} بـ ${Math.abs(df)}% من آخر ${dayById(a.day).en}`.replace('حجم أ','الحجم أ')}
  S.sessions.push(rec);S.active=null;stopRest();saveNow();
  closeSession();
  confetti();beep(2);buzz([100,60,100,60,250]);
  const d=dayById(rec.day);
  openMod(`<div class="big-emoji">💪</div><h3 style="text-align:center;margin-top:8px">خلّصت <span class="ltr">${d.en}</span></h3>
    <p class="muted" style="text-align:center;margin:4px 0 0">${fdateLong(rec.start)}</p>
    <div class="sum"><div class="stat"><div class="v">${hms(rec.dur)}</div><div class="l">المدة</div></div>
    <div class="stat"><div class="v">${rec.sets}</div><div class="l">مجموعات</div></div>
    <div class="stat"><div class="v">${fmt(rec.vol)}</div><div class="l">كجم حجم</div></div></div>
    ${cmp?`<div class="cmp">${cmp}</div>`:''}
    ${prs.length?`<div class="sec" style="margin-top:6px"><h2>أرقام قياسية 🏆</h2></div>${prs.map(r=>`<div class="pr"><b>${esc(r.name)}</b><span class="num">${fmt(r.w)}×${r.r}</span><small class="ltr">+${r.up}%</small></div>`).join('')}`:`<p class="muted" style="text-align:center">تمرين ثابت. ركّز بكرة على زيادة وزن أو عدّة.</p>`}
    <button class="btn pri block" style="margin-top:12px" data-close>تمام</button>`);
}

function saveEdit(){

function lineChart(pts,unit){
  const W=340,H=190,pl=36,pr=14,pt=16,pb=28;
  if(pts.length<1)return'';
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.18;lo=Math.max(0,lo-pad);hi+=pad;
  const X=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a3e63" stroke-dasharray="3 5"/><text x="${pl-6}" y="${y+4}" text-anchor="end" fill="#667a9c" font-size="12">${fmt(Math.round(v*10)/10)}</text>`}
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  const area=pts.length>1?`<path d="${path}L${X(pts.length-1)} ${H-pb}L${X(0)} ${H-pb}Z" fill="url(#ga)"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?5.5:4}" fill="${i===pts.length-1?'#ffc531':'#162540'}" stroke="#ffc531" stroke-width="2.5"/>`).join('');
  const step=Math.max(1,Math.ceil(pts.length/5));
  const xl=pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#667a9c" font-size="12">${p.l}</text>`:'').join('');
  const lastp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني للتقدّم"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffc531" stop-opacity=".28"/><stop offset="1" stop-color="#ffc531" stop-opacity="0"/></linearGradient></defs>${g}${area}<path d="${path}" fill="none" stroke="#ffc531" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}
  <text x="${Math.min(W-pr,Math.max(pl+20,X(pts.length-1)))}" y="${Y(lastp.y)-12}" text-anchor="middle" fill="#ffc531" font-size="15" font-weight="800">${fmt(Math.round(lastp.y*10)/10)}</text></svg>`;
}

function musclesFor(n){
  if(MM[n])return MM[n];
  const s=n.toLowerCase();
  if(/shrug/.test(s))return[['traps',1]];
  if(/calf/.test(s))return[['calves',1]];
  if(/leg curl|hamstring/.test(s))return[['hams',1]];
  if(/leg ext/.test(s))return[['quads',1]];
  if(/squat|leg press|lunge/.test(s))return MM['Hack Squat'];
  if(/lateral/.test(s))return MM['Cable Lateral Raises'];
  if(/rear/.test(s))return MM['SA Rear Delt Flies'];
  if(/shoulder|overhead press|military/.test(s))return MM['Machine Shoulder Press'];
  if(/fly|pec|chest|bench|incline|push.?up/.test(s))return MM['Chest Press Machine'];
  if(/tricep|pushdown|skull|dip/.test(s))return[['triceps',1]];
  if(/curl|bicep/.test(s))return MM['Face Away Curl'];
  if(/pulldown|pull.?up|chin|lat /.test(s))return MM['Machine Wide Grip Lat Pulldown'];
  if(/row/.test(s))return MM['T Bar Row'];
  if(/crunch|plank|sit.?up|abs/.test(s))return MM['Cable Crunch'];
  if(/deadlift|good morning/.test(s))return MM['RDL'];
  if(/hip|glute|bridge/.test(s))return MM['Hip Thrust'];
  return[];
}

function bodyStats(p){
  const now=Date.now(),ws=weekStart(now);
  const [a,b]=p==='week'?[ws,now+1]:p==='7d'?[now-7*DAY_MS,now+1]:[addDays(ws,-7),ws];
  const m={};MUS.forEach(x=>m[x.k]={sets:0,vol:0,exs:{},last:0});
  const ss=S.sessions.filter(s=>s.start>=a&&s.start<b);let total=0;
  ss.forEach(s=>s.ex.forEach(e=>{
    const n=e.sets.length,v=e.sets.reduce((t,x)=>t+x.w*x.r,0);total+=n;
    musclesFor(e.name).forEach(([k,w])=>{const r=m[k];if(!r)return;r.sets+=n*w;if(w>=1)r.vol+=v;r.exs[e.name]=(r.exs[e.name]||0)+n;r.last=Math.max(r.last,s.start)});
  }));
  return{m,ss,total,range:[a,b]};
}
const lerp=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));

function heat(t){
  for(let i=1;i<STOPS.length;i++){if(t<=STOPS[i][0]){const a=STOPS[i-1],b=STOPS[i],c=lerp(a[1],b[1],(t-a[0])/(b[0]-a[0]));return `rgb(${c[0]},${c[1]},${c[2]})`}}
  const c=STOPS[STOPS.length-1][1];return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function setAng(a){

function animTo(t,dur=650){
  cancelAnimationFrame(bm.anim);
  const a0=bm.ang,t0=performance.now();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){setAng(t);return}
  const ease=x=>1-Math.pow(1-x,4);
  (function f(n){const x=Math.min(1,(n-t0)/dur);setAng(a0+(t-a0)*ease(x));if(x<1)bm.anim=requestAnimationFrame(f)})(t0);

function angFor(face){
  const k=Math.round(bm.ang/180);
  if(((k%2)+2)%2===face)return k*180;
  const u=(k+1)*180,d=(k-1)*180;
  return Math.abs(u-bm.ang)<Math.abs(d-bm.ang)?u:d;
}

  }else{
    const hit=MUS.filter(x=>R.m[x.k].sets>0),miss=MUS.filter(x=>!R.m[x.k].sets);
    P.innerHTML=`<div class="stats"><div class="stat"><div class="v">${hit.length}<small>/${MUS.length}</small></div><div class="l">عضلات اتشغّلت</div></div>
     <div class="stat"><div class="v">${fmt(R.total)}</div><div class="l">مجموعات فعلية</div></div>
     <div class="stat"><div class="v">${R.ss.length}</div><div class="l">تمارين</div></div></div>
     ${balHtml(R)}
     ${R.ss.length?(miss.length?`<div class="card" style="margin-top:10px"><b>لسه ماتشغّلتش في الفترة دي</b><div class="tags">${miss.map(x=>`<button class="tag" data-bmsel="${x.k}">${x.ar}</button>`).join('')}</div></div>`:'<div class="card" style="margin-top:10px">كل العضلات الـ'+MUS.length+' اتشغّلت في الفترة دي.</div>'):'<div class="empty" style="margin-top:10px">مفيش تمارين متسجّلة في الفترة دي. أول ما تخلّص تمرين، العضلات هتنوّر هنا.</div>'}`;
  }
  // ranked list
  const mx=Math.max(target,...MUS.map(x=>R.m[x.k].sets));
  $('#bmList').innerHTML=[...MUS].sort((x,y)=>R.m[y.k].sets-R.m[x.k].sets||MUS.indexOf(x)-MUS.indexOf(y)).map(x=>{
    const s=R.m[x.k].sets,t=s>0?Math.max(.12,Math.min(1,s/target)):0;
    return `<button class="bmrow ${bm.sel===x.k?'on':''}" data-bmsel="${x.k}"><span class="nm">${x.ar}<small>${x.en}</small></span><span class="tr"><i style="width:${s/mx*100}%;background:${s?heat(t):'transparent'}"></i></span><span class="num" style="color:${s?heat(t):'var(--mut2)'}">${fmt(Math.round(s*10)/10)}</span></button>`}).join('');
}

/* ================= boot ================= */
renderHome();
if(S.active)toast('عندك تمرين شغّال — اضغط «كمّل»');
(async function restoreFromIdb(){
  if(S.sessions.length||S.active)return;
  const v=await idbGet('state');if(!v)return;
  try{const j=JSON.parse(v);if(!j||!Array.isArray(j.sessions)||!j.sessions.length)return;
    S=Object.assign({sessions:[],active:null,start:null,notes:{},bw:[],lastBackup:0,bkSnooze:0},j);S.settings=Object.assign({},DEF,j.settings||{});S.notes=S.notes||{};S.bw=S.bw||[];
    saveNow();setTab(tab);toast('رجّعت بياناتك من النسخة التلقائية');
  }catch(e){}
})();
// hosted (https) mode: installable + offline
if(/^https?:$/.test(location.protocol)){
  fetch('manifest.webmanifest',{method:'HEAD'}).then(r=>{
    if(!r.ok)return;
    const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }).catch(()=>{});
}
</script>
